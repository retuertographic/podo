<html lang="es"><head><meta charset="utf-8">

<style>
  * { box-sizing: border-box; margin: 0; }
  body { width: 1200px; height: 630px; overflow: hidden; background: #f8f5ef; font-family: Inter, sans-serif; color: #2b2f2c; }
  .card { display: grid; grid-template-columns: 470px 1fr; height: 100%; }
  .photo { position: relative; background: #efe9e0; overflow: hidden; }
  .photo img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 30%; transform: scale(1.75); transform-origin: 47% 30%; }
  .info { padding: 58px 64px 52px 60px; display: flex; flex-direction: column; position: relative; }
  .info::before { content: ""; position: absolute; right: -120px; top: -140px; width: 420px; height: 420px; border-radius: 50%; background: radial-gradient(circle, rgba(201,214,201,.75), transparent 68%); }
  .brand { display: flex; align-items: center; gap: 14px; color: #3c5045; position: relative; }
  .brand svg { width: 52px; height: 52px; color: #5e7b69; }
  .brand b { font-family: Fraunces, serif; font-size: 30px; font-weight: 600; letter-spacing: .03em; display: block; line-height: 1; }
  .brand small { font-size: 16px; color: #7a807b; letter-spacing: .04em; }
  h1 { font-family: Fraunces, serif; font-weight: 500; font-size: 60px; line-height: 1.04; color: #3c5045; margin-top: 40px; letter-spacing: -.01em; }
  .role { font-size: 24px; font-weight: 600; color: #5e7b69; margin-top: 14px; }
  .tag { font-family: Allura, cursive; font-size: 40px; color: #9a7a62; margin-top: 18px; line-height: 1.05; }
  .contact { margin-top: auto; display: grid; gap: 12px; position: relative; }
  .row { display: flex; align-items: center; gap: 14px; font-size: 23px; }
  .row strong { font-size: 30px; color: #3c5045; letter-spacing: .02em; }
  .ico { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: #e3ebe3; color: #3c5045; flex: none; }
  .ico.wa { background: #25d366; color: #fff; }
  .ico svg { width: 24px; height: 24px; }
</style></head>
